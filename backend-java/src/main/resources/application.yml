spring:
  application:
    name: equity-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/equity_intelligence}
    username: ${SPRING_DATASOURCE_USERNAME:equity_app}
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: app

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: ${SERVER_PORT:8080}

analytics:
  base-url: ${ANALYTICS_BASE_URL:http://localhost:8000}
  connect-timeout: ${ANALYTICS_CONNECT_TIMEOUT:2s}
  read-timeout: ${ANALYTICS_READ_TIMEOUT:30s}

equity:
  identity:
    closed-test:
      enabled: ${CLOSED_TEST_IDENTITY_ENABLED:false}
      issuer: ${CLOSED_TEST_IDENTITY_ISSUER:equity-local}
