name: equity-intelligence-platform

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-equity_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-equity_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-equity_app} -d ${POSTGRES_DB:-equity_intelligence}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  analysis-python:
    build:
      context: ./analysis-python
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-twelve_data}
      TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY:-}
      ANALYTICS_DATABASE_URL: postgresql://${POSTGRES_USER:-equity_app}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-equity_intelligence}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-java:
    build:
      context: .
      dockerfile: backend-java/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-equity_intelligence}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-equity_app}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      ANALYTICS_BASE_URL: http://analysis-python:8000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      analysis-python:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://localhost:8080/actuator/health/readiness",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_INTERNAL_URL: http://backend-java:8080
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      backend-java:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://$${HOSTNAME}:3000/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
