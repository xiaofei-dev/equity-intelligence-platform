[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "equity-analysis"
version = "0.1.0"
description = "Analytics service for the Equity Intelligence Platform"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.140,<0.141",
    "psycopg[binary]>=3.2,<4",
    "uvicorn[standard]>=0.35,<0.36",
    "yfinance>=0.2.54,<0.3",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.9,<3",
    "pytest>=8.4,<9",
    "ruff>=0.12,<0.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/equity_analysis"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "controlled_artifact: requires private or licensed validation evidence excluded from Git",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
